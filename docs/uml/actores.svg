.9551" x="745" y="294.873">y analiza resultados.</text></g><g class="entity" data-entity="GMN21" data-source-line="37" data-uid="ent0022" id="entity_GMN21"><path d="M458.5,257.7969 L458.5,295.7344 L703.0469,295.7344 L703.0469,267.7969 L693.0469,257.7969 L458.5,257.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M693.0469,257.7969 L693.0469,267.7969 L703.0469,267.7969 L693.0469,257.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="199.3535" x="464.5" y="273.9355">Consulta y reproduce resultados;</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="223.5469" x="464.5" y="287.9043">no modifica el escenario ni el c&#243;digo.</text></g><g class="entity" data-entity="GMN24" data-source-line="42" data-uid="ent0025" id="entity_GMN24"><path d="M1060.5,243.7969 L1060.5,309.6719 A0,0 0 0 0 1060.5,309.6719 L1313.707,309.6719 A0,0 0 0 0 1313.707,309.6719 L1313.707,253.7969 L1303.707,243.7969 L1191,243.7969 L1187,179.3869 L1183,243.7969 L1060.5,243.7969 A0,0 0 0 0 1060.5,243.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1303.707,243.7969 L1303.707,253.7969 L1313.707,253.7969 L1303.707,243.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="232.207" x="1066.5" y="259.9355">UOCT/MTT, DTPM, SECTRA, municipios</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="219.8848" x="1066.5" y="273.9043">(Las Condes, Providencia, Santiago).</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="211.9453" x="1066.5" y="287.873">Entregan aforos, programaciones y</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="211.7168" x="1066.5" y=